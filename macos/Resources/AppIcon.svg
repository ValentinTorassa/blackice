<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Blackice.app icon on the macOS template: a 1024 canvas, an 824 rounded square with a
       185 radius, and the mark from site/public/logo.svg at 16 times its size, centered.
       macos/scripts/make-icon.sh renders AppIcon.icns from this file. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <path transform="translate(256 256) scale(16)" d="M16 2L28 9V23L16 30L4 23V18H16V14H4V9Z" fill="#ededed"/>
</svg>
